name: Build & Bundle N-API Renderer Addon

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prebuilds:
    name: Build on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
        node: [20.x]  # Changed from 18.x to 20.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install raylib and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglfw3-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libasound2-dev \
            libudev-dev

      - name: Install raylib and dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select --install || true
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          brew update
          brew install glfw cmake pkg-config

      - name: Install raylib and dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -DisableMetrics
          C:\vcpkg\vcpkg integrate install
          C:\vcpkg\vcpkg install raylib:x64-windows

          New-Item -ItemType Directory -Force -Path "C:\vcpkg_installed\x64-windows\lib"
          Copy-Item "C:\vcpkg\installed\x64-windows\lib\raylib.lib" "C:\vcpkg_installed\x64-windows\lib\"

          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare prebuild output directory
        run: mkdir -p prebuilds

      - name: Add build tools
        run: npm install --save-dev prebuildify@^6 node-gyp-build node-gyp

      - name: Build raylib from source (Linux/macOS fallback)
        if: runner.os != 'Windows'
        run: |
          if ! pkg-config --exists raylib && [ "$RUNNER_OS" != "Windows" ]; then
            echo "Building raylib from source..."
            git clone https://github.com/raysan5/raylib.git raylib_src
            cd raylib_src
            mkdir build && cd build
            cmake .. -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
            make -j4
            sudo make install
            cd ../..
          fi
      
      - name: Install dependencies
        run: npm ci

      - name: Generate prebuilds
        run: npx prebuildify --napi --strip
      - name: Bundle Raylib shared library (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          ADDON="prebuilds/linux-x64/renderer.node"
          OUTPUT="prebuilds/linux-x64"

          # Find the exact Raylib SONAME required by the addon
          SONAME=$(readelf -d "$ADDON" \
            | grep -oE '\[libraylib\.so[^]]*\]' \
            | tr -d '[]' \
            | head -n1)

          if [ -z "$SONAME" ]; then
            echo "ERROR: Raylib dependency not found in renderer.node"
            exit 1
          fi

          echo "Required library: $SONAME"

          # Locate the installed Raylib library
          sudo ldconfig

          LIBRARY=$(ldconfig -p | awk -v name="$SONAME" \
            '$1 == name {print $NF; exit}')

          if [ -z "$LIBRARY" ]; then
            echo "ERROR: Cannot locate $SONAME"
            exit 1
          fi

          # Bundle Raylib
          cp -L "$LIBRARY" "$OUTPUT/$SONAME"

          # Configure the addon to search its own directory
          patchelf --set-rpath '$ORIGIN' "$ADDON"

          echo "Checking renderer dependencies:"
          ldd "$ADDON"

          echo "Checking bundled Raylib dependencies:"
          ldd "$OUTPUT/$SONAME"

          if ldd "$ADDON" | grep -q "not found"; then
            echo "ERROR: Unresolved native dependencies"
            exit 1
          fi

          echo "Raylib bundled successfully."

      - name: Upload prebuild artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renderer-prebuild-${{ matrix.os }}-node${{ matrix.node }}
          path: prebuilds/**
